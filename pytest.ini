[pytest]
# Тесты NOVA AI живут в tests/. Без этого указания pytest собирает тесты
# рекурсивно от корня и натыкается на kokoro/test_kokoro.py — тест
# вендоренной TTS-модели, которому нужен пакет kokoro_onnx из отдельного
# окружения kokoro_env/. Сбор падал целиком, и `pytest` без аргументов
# не запускал ни одного теста NOVA AI.
#
# Явный путь всё ещё работает, если он реально нужен:
#   kokoro_env/bin/python -m pytest kokoro/
testpaths = tests

# Медленные бенчмарки (например, 10000 записей в semantic memory с реальными
# эмбеддингами — ~11 минут) не запускаются по умолчанию, чтобы `pytest tests/`
# не висел. Запуск вручную: pytest -m slow
addopts = -m "not slow"

# Регистрация меток, чтобы не было PytestUnknownMarkWarning.
markers =
    slow: медленные бенчмарки, пропускаемые по умолчанию

# Предупреждения приходят из сторонних пакетов (speech_recognition тянет
# aifc/audioop, удаляемых в Python 3.13). Прячем ровно их, чтобы реальные
# предупреждения NOVA AI не тонули в шуме.
filterwarnings =
    ignore:'aifc' is deprecated:DeprecationWarning
    ignore:'audioop' is deprecated:DeprecationWarning
